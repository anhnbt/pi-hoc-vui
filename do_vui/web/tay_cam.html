<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tay cầm Đố vui</title>
<style>
  :root {
    --nen: #1b2a4a; --chu: #ffffff; --phu: #b9c6e4;
    --do: #e5484d; --xanh-la: #30a46c; --vang: #f5b400; --xanh-duong: #3e7bfa;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; background: var(--nen); color: var(--chu);
    font-family: system-ui, "Noto Sans", sans-serif; touch-action: manipulation; }
  body { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
  .luoi { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  button { border: none; border-radius: 24px; color: var(--chu); font: inherit; font-weight: 700;
    font-size: 15vw; transition: transform .08s, filter .08s; }
  button:active, button.nhan { transform: scale(.94); filter: brightness(1.25); }
  .do { background: var(--do); } .xanh_la { background: var(--xanh-la); }
  .vang { background: var(--vang); color: #2b2100; } .xanh_duong { background: var(--xanh-duong); }
  .hang { display: flex; gap: 16px; height: 18vh; }
  .hang button { flex: 1; background: #34466e; font-size: 7vw; }
  .hang .ok { flex: 2; background: var(--chu); color: var(--nen); }
  #loi { text-align: center; color: var(--phu); min-height: 1.2em; }
</style>
</head>
<body>
  <div class="luoi">
    <button class="do" data-phim="do">1</button>
    <button class="xanh_la" data-phim="xanh_la">2</button>
    <button class="vang" data-phim="vang">3</button>
    <button class="xanh_duong" data-phim="xanh_duong">4</button>
  </div>
  <div class="hang">
    <button data-phim="nghe_lai">🔊 Nghe lại</button>
    <button class="ok" data-phim="chon">OK ▶</button>
  </div>
  <p id="loi"></p>
<script>
const loi = document.getElementById("loi");
document.querySelectorAll("button").forEach(nut => {
  // pointerdown để bấm là ăn ngay, không phải chờ nhả tay như click
  nut.addEventListener("pointerdown", e => {
    e.preventDefault();
    navigator.vibrate?.(30);
    fetch("/bam?phim=" + nut.dataset.phim, { method: "POST" })
      .then(r => { loi.textContent = r.ok ? "" : "Lỗi " + r.status; })
      .catch(() => { loi.textContent = "Không kết nối được với Pi"; });
  });
});
</script>
</body>
</html>
